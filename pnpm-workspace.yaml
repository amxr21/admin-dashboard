packages:
  - 'frontend'
  - 'backend'

# ─── Supply-chain: minimum release age ──────────────────────────────────────
# Refuse to install any package published less than this many minutes ago.
# Defends against the hijacked-maintainer attack: a compromised account
# publishes a malicious version, bots auto-merge it within minutes, and it's in
# production before anyone notices. Waiting a day means npm/GitHub/researchers
# have a window to yank it first.
#
# STATED EXPLICITLY ON PURPOSE. pnpm 10 defaulted this to 0; pnpm 11 defaults
# it to 1440. Relying on the default means a pnpm upgrade silently changes the
# project's security posture — and silently breaks CI, which is exactly what
# happened here before this line existed.
#
# KEEP IN SYNC with `cooldown.default-days` in .github/dependabot.yml. That is
# set to 3 days, comfortably above this floor, so Dependabot never proposes a
# version pnpm would then reject at install time.
minimumReleaseAge: 1440

# pnpm blocks dependency postinstall scripts by default (supply-chain hardening).
# Each package below is explicitly allowed because it cannot work without its
# build step — all of them fetch or compile a platform-specific binary:
#
#   prisma / @prisma/*  → query engine binaries; `prisma generate` fails without them
#   esbuild             → the bundler binary itself
#   sharp               → native image lib behind next/image optimization
#   @sentry/cli         → source-map upload binary used at build time
#   unrs-resolver       → native module resolver used by eslint-plugin-import
#
# Adding a new entry here is a security decision. Don't set one to true just to
# silence the warning — check what the script actually does first.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
