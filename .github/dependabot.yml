# admin-dashboard — Dependabot
#
# Weekly PRs to update dependencies, grouped by type so this doesn't produce
# 30 tiny PRs. One workspace root directory covers both packages — this is a
# pnpm workspace with a single lockfile, not two independent ones.
#
# ─── WHY `cooldown` IS HERE (do not remove) ─────────────────────────────────
# pnpm 11 defaults `minimumReleaseAge` to 1440 minutes (1 day) — it refuses to
# install any package published less than 24h ago, as supply-chain defence
# against hijacked-maintainer attacks. pnpm 10 defaulted this to 0, so this
# only started applying when the project pinned pnpm@11.
#
# Dependabot, left alone, opens a PR the instant a version publishes. Its
# lockfile then contains packages younger than pnpm's floor, and every CI job
# dies at `pnpm install --frozen-lockfile` with:
#   ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION
#
# Every job fails, so it looks like a broken pipeline rather than a policy
# doing its job. The fix is to make both sides agree: Dependabot waits at
# least as long as pnpm's floor before proposing anything.
#
# 3 days (not 1) deliberately buys margin — a package published Friday night
# won't be proposed until it has genuinely aged, regardless of timezone or
# when the weekly run fires.
#
# If you ever raise pnpm's `minimumReleaseAge`, raise these to match or CI
# starts failing again.
# ─────────────────────────────────────────────────────────────────────────────

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      # BOTH groups are minor+patch ONLY. Without `update-types` on the dev
      # group, Dependabot bundled TypeScript 5→7, ESLint 9→10, Prisma 6→7,
      # @types/node 22→26 and eslint-config-next 15→16 into ONE pull request
      # (#12, closed). That is a migration wearing a dependency-bump costume:
      # it broke the build for real (TS2882 on side-effect CSS imports, ESLint
      # 10 failing to load the flat config), and because it was a group, there
      # was no way to take the safe parts without the breaking ones.
      #
      # Majors now arrive as individual PRs, each reviewable and revertible on
      # its own. That is the point.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    # Majors that are MIGRATIONS, not bumps, as of 2026-09-26. Each one left
    # as an open PR also holds one of the 5 slots below: #48-#52 sat open from
    # July to September and blocked every other update, minor and patch
    # included. Remove an entry when you actually take that migration on.
    #   - typescript 7: the native (Go) compiler. typescript-eslint supports
    #     only <6.1, and Next's type checking uses the JS API.
    #   - eslint / @eslint/js 10: the backend is on 10. The frontend is held on
    #     9 because eslint-config-next 15 loads through @rushstack/eslint-patch,
    #     which ESLint 10 breaks. That clears with the Next 16 upgrade.
    #   - prisma / @prisma/client 7+: datasource `url` leaves the schema for
    #     prisma.config.ts, a driver adapter becomes mandatory, and the client
    #     generator changes, across the 130+ files that import it.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Actions are pinned by major tag, not resolved through pnpm, so pnpm's
    # policy never applies to them. Cooldown here is just prudence against a
    # compromised Action release.
    cooldown:
      default-days: 3
