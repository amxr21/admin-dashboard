# admin-dashboard — End-to-end tests
#
# Builds the frontend, serves it with `next start` on the runner, and runs
# Playwright against it. No backend and no database: every spec intercepts its
# API traffic with page.route() (see frontend/e2e/), and the smoke spec only
# checks the signed-out redirect.
#
# Why this exists: ci.yml never ran Playwright, and by the 2026-09-25 release
# gate the suite had silently rotted to 36 failures on dev (repaired in #276).
#
# Runs on every push to dev (i.e. each merged PR), nightly, and on demand. Not
# on pull requests: it takes several minutes, and dev PRs keep the fast ci.yml
# battery. A red run here means a merged PR broke a real browser flow.
#
# CI=1 makes playwright.config.ts use 1 worker + 2 retries. Parallel workers
# on one small runner starve the server and produce spurious React #418
# hydration errors that aren't app bugs.

name: E2E

on:
  push:
    branches: [dev]
  schedule:
    - cron: '30 2 * * *' # daily, 02:30 UTC (after Nightly)
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      # Same dummy build-time values as ci.yml's build job. The API URL is
      # never reached: the specs mock it.
      NEXT_PUBLIC_APP_MODE: local
      NEXT_PUBLIC_API_URL_LOCAL: http://localhost:4000/api/v1
      NEXT_PUBLIC_ENV: ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      # No `version:` — see the comment in ci.yml. package.json's
      # "packageManager" field is the single source of truth.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --filter ./frontend build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup pnpm start > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/en/login; then exit 0; fi
            sleep 2
          done
          echo "next start did not come up in 120s"; cat next-start.log; exit 1

      - name: Run Playwright
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: pnpm e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/next-start.log
          retention-days: 7
