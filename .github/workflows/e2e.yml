# admin-dashboard — End-to-end tests
#
# Runs Playwright against live preview URLs from Vercel (FE) and Render (BE).
# Kept separate from ci.yml because it's slow (~5-10 min) and depends on preview
# deploys being ready first.
#
# CURRENTLY MANUAL-ONLY — see the note on the `on:` trigger below for why, and
# what to do to turn it back on. Once re-enabled it should run on PRs into
# `main` only: dev PRs get the fast ci.yml battery, main PRs get the full one.
#
# When it IS running: a failing E2E almost always means a real user-facing bug.
# Don't skip those.

name: E2E

# DISABLED until a real backend preview URL exists.
#
# The Render service for this project was created MANUALLY, not via Blueprint
# (Blueprint requires a paid plan) — and manual services get no per-PR preview
# environments. So the "Wait for Render preview" step below has nothing real to
# wait for, fails after its timeout, and marks every PR into `main` as UNSTABLE
# even when all required checks pass.
#
# A permanently-red check trains everyone to ignore red checks, which is worse
# than having no check. So this runs on-demand only for now.
#
# TO RE-ENABLE, pick one:
#   A. Point it at a persistent dev backend — replace the Render step with
#      `echo "url=${{ secrets.RENDER_DEV_BACKEND_URL }}" >> "$GITHUB_OUTPUT"`
#      and add that repo secret. Simplest, works today.
#   B. Move Render to a Blueprint (paid) and poll their API for the real
#      per-PR preview URL.
# Then restore the `pull_request:` trigger below and add `Playwright` as a
# required check on main-protection.
on:
  workflow_dispatch: {}
  # pull_request:
  #   branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-previews:
    name: Wait for Vercel + Render previews
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      frontend_url: ${{ steps.vercel.outputs.url }}
      backend_url: ${{ steps.render.outputs.url }}
    steps:
      - name: Wait for Vercel preview
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Wait for Render preview
        id: render
        run: |
          echo "TODO: implement Render preview readiness check once Render is connected"
          echo "url=https://admin-dashboard-backend-preview-${{ github.event.number }}.onrender.com" >> "$GITHUB_OUTPUT"

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: wait-for-previews
    steps:
      - uses: actions/checkout@v7
      # No `version:` — see the comment in ci.yml. package.json's
      # "packageManager" field is the single source of truth.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          BASE_URL: ${{ needs.wait-for-previews.outputs.frontend_url }}
          API_URL: ${{ needs.wait-for-previews.outputs.backend_url }}/api/v1
        run: pnpm e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
