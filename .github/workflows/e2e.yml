# admin-dashboard — End-to-end tests
#
# Runs Playwright against a live Vercel preview URL (FE) and a persistent dev
# Render backend (BE, via RENDER_DEV_BACKEND_URL). Kept separate from ci.yml
# because it's slow (~5-10 min) and depends on the frontend preview deploy
# being ready first.
#
# CURRENTLY MANUAL-ONLY — see the note on the `on:` trigger below for why, and
# what to do to turn it back on. Once re-enabled it should run on PRs into
# `main` only: dev PRs get the fast ci.yml battery, main PRs get the full one.
#
# When it IS running: a failing E2E almost always means a real user-facing bug.
# Don't skip those.

name: E2E

# DISABLED until RENDER_DEV_BACKEND_URL points at a backend with a real,
# reachable database.
#
# Went with option A below: a persistent dev Render service already exists,
# but as of 2026-08-04 its database is local-only, so a run against it would
# fail every test without proving anything. Re-enable the `pull_request`
# trigger once that DB is sorted — the workflow itself is otherwise ready.
#
# Previously blocked on a different problem (Render service created MANUALLY,
# not via Blueprint, so no per-PR preview URLs existed) — resolved by using a
# single persistent dev backend instead of a preview-per-PR model:
#   A. Point it at a persistent dev backend — DONE. Uses
#      `secrets.RENDER_DEV_BACKEND_URL` directly as the backend URL, no
#      Render-preview-wait step needed.
#   B. (not chosen) Move Render to a Blueprint (paid) and poll their API for
#      the real per-PR preview URL.
# Once the dev DB is fixed, restore the `pull_request:` trigger below and add
# `Playwright` as a required check on main-protection.
on:
  workflow_dispatch: {}
  # pull_request:
  #   branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-frontend-preview:
    name: Wait for Vercel preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      frontend_url: ${{ steps.vercel.outputs.url }}
    steps:
      - name: Wait for Vercel preview
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: wait-for-frontend-preview
    steps:
      - uses: actions/checkout@v7
      # No `version:` — see the comment in ci.yml. package.json's
      # "packageManager" field is the single source of truth.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          BASE_URL: ${{ needs.wait-for-frontend-preview.outputs.frontend_url }}
          API_URL: ${{ secrets.RENDER_DEV_BACKEND_URL }}/api/v1
        run: pnpm e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
